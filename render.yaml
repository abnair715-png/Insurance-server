# Render Blueprint for the Insurance Agent Platform API.
#
# Use it via Render's "Blueprint" flow, or simply mirror these settings when
# creating the Web Service by hand. Every secret is marked `sync: false` so
# Render prompts for it rather than storing it in the repository.
#
# This repository IS the service root, so no rootDir is set.
services:
  - type: web
    name: insurance-agent-platform-api
    runtime: node
    plan: free
    region: oregon

    # The committed .npmrc already forces devDependencies to install, whatever
    # NODE_ENV says. --include=dev here is belt-and-braces: either alone is
    # enough, and both together cost nothing.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start

    # Render restarts the service if this stops answering. It also gives the
    # free plan a cheap way to be woken by an uptime pinger.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected by Render; the app reads it via process.env.PORT.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: DOCUMENT_LINK_SECRET
        sync: false
      - key: DOCUMENT_LINK_TTL_HOURS
        value: '168'
      - key: CLIENT_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: CORS_ADDITIONAL_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: inr
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: COMPANY_NAME
        value: Sentinel General Insurance
      - key: COMPANY_SUPPORT_EMAIL
        sync: false
      - key: COMPANY_SUPPORT_PHONE
        sync: false
